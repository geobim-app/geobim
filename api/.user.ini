; Raised for pointcloud-upload.php. Scoped to api/ only (PHP-FPM .user.ini),
; not a server-wide php.ini change. 3 GB cap — keep in sync with
; pointcloud-upload.php's MAX_UPLOAD_BYTES; Apache's own request-body cap is
; lifted for that endpoint in the geobim.app vhost. flock()-serialized
; conversion prevents concurrent-job overload; the cap is about not letting
; one huge upload tie up the conversion queue or eat disk space unexpectedly.
upload_max_filesize = 3G
post_max_size = 3100M
max_execution_time = 300
; Receiving a multi-GB upload takes far longer than the default 60 s.
max_input_time = 3600
memory_limit = 256M
