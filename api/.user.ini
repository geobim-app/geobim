; Raised for pointcloud-upload.php. Scoped to api/ only (PHP-FPM .user.ini),
; not a server-wide php.ini change. Cap deliberately kept modest for now
; (200 MB — see pointcloud-upload.php's MAX_UPLOAD_BYTES, keep the two in
; sync) while usage is still low-volume/single-user; flock()-serialized
; conversion already prevents concurrent-job overload, this limit is mainly
; about not letting one huge upload tie up the conversion queue for a long
; time or eat disk space unexpectedly.
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 300
memory_limit = 256M
