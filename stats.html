<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - geobim.app</title>
  <style>
    :root{--bg:#0f1117;--surface:#1a1d27;--border:#2d3142;--text:#e4e6ed;--text2:#9498a8;--accent:#4f8ff7;--green:#34d399;--orange:#f59e0b}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .container{max-width:960px;margin:0 auto;padding:24px}
    .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
    .header h1{font-size:1.3rem;font-weight:600;background:linear-gradient(135deg,var(--accent),#7c5cfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .date-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .date-picker input[type="date"]{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;color-scheme:dark}
    .date-picker button,.range-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s}
    .date-picker button:hover,.range-btn:hover,.range-btn.active{border-color:var(--accent);color:var(--accent)}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
    .stat-value{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),#7c5cfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .stat-label{font-size:.72rem;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
    .chart-title{font-size:.85rem;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
    .bar-chart{display:flex;align-items:flex-end;gap:2px;height:120px}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
    .bar{width:100%;min-width:4px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--accent),rgba(79,143,247,.4));transition:height .4s ease}
    .bar.secondary{background:linear-gradient(180deg,var(--green),rgba(52,211,153,.4))}
    .bar-label{font-size:9px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .bar-value{font-size:9px;color:var(--text2);margin-bottom:2px}
    .data-table{width:100%;border-collapse:collapse}
    .data-table td{padding:8px 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.03)}
    .data-table td:last-child{text-align:right;font-family:monospace;color:var(--accent)}
    .data-table .bar-cell{width:40%;padding-right:12px}
    .inline-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),rgba(79,143,247,.3))}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:700px){.two-col{grid-template-columns:1fr}}
    .loading{text-align:center;padding:60px;color:var(--text2)}
    .legend{display:flex;gap:16px;margin-bottom:8px}
    .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
    .legend-dot{width:8px;height:8px;border-radius:2px}
    footer{text-align:center;padding:24px;color:var(--text2);font-size:.75rem}
    footer a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>geobim.app Analytics</h1>
      <div class="date-picker">
        <button class="range-btn" onclick="setRange('today',this)">Heute</button>
        <button class="range-btn active" onclick="setRange('7d',this)">7 Tage</button>
        <button class="range-btn" onclick="setRange('30d',this)">30 Tage</button>
        <button class="range-btn" onclick="setRange('all',this)">Alles</button>
        <input type="date" id="dateFrom">
        <span style="color:var(--text2);font-size:12px">-</span>
        <input type="date" id="dateTo">
        <button onclick="loadCustomRange()">Laden</button>
      </div>
    </div>
    <div id="content"><div class="loading">Lade Daten...</div></div>
  </div>
  <footer><a href="/">geobim.app</a> - Server-side Analytics (kein Tracking, keine Cookies)</footer>
  <script>
    function setRange(range,btn){document.querySelectorAll('.range-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active');var to=new Date(),from=new Date();if(range==='today'){}else if(range==='7d')from.setDate(from.getDate()-7);else if(range==='30d')from.setDate(from.getDate()-30);else if(range==='all')from=new Date('2026-03-24');document.getElementById('dateFrom').value=fmt(from);document.getElementById('dateTo').value=fmt(to);loadData(fmt(from),fmt(to))}
    function loadCustomRange(){var f=document.getElementById('dateFrom').value,t=document.getElementById('dateTo').value;if(f&&t)loadData(f,t)}
    function fmt(d){return d.toISOString().split('T')[0]}
    function loadData(from,to){document.getElementById('content').innerHTML='<div class="loading">Lade Daten...</div>';fetch('/api/stats.php?from='+from+'&to='+to).then(function(r){return r.json()}).then(function(data){render(data)}).catch(function(e){document.getElementById('content').innerHTML='<div class="loading">Fehler: '+e.message+'</div>'})}
    function render(d){var html='';html+='<div class="stats-grid">';html+=card(d.summary.pageViews,'Seitenaufrufe');html+=card(d.summary.uniqueVisitors,'Besucher');html+=card(d.summary.totalRequests,'Requests');html+=card(d.summary.bandwidth+' MB','Bandbreite');html+='</div>';var dates=Object.keys(d.daily.pageViews);if(dates.length>0){html+='<div class="chart-card"><div class="chart-title">Besucher & Seitenaufrufe pro Tag</div><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Seitenaufrufe</div><div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Besucher</div></div>'+dailyChart(d.daily)+'</div>'}html+='<div class="two-col"><div class="chart-card"><div class="chart-title">Seiten</div>'+tableChart(d.pages)+'</div><div class="chart-card"><div class="chart-title">Referrer</div>'+(Object.keys(d.referrers).length>0?tableChart(d.referrers):'<div style="color:var(--text2);font-size:13px;padding:12px 0">Keine externen Referrer</div>')+'</div></div>';html+='<div class="two-col"><div class="chart-card"><div class="chart-title">Requests pro Stunde</div>'+hourlyChart(d.hourly)+'</div><div class="chart-card"><div class="chart-title">Browser</div>'+tableChart(d.browsers)+'</div></div>';document.getElementById('content').innerHTML=html}
    function card(v,l){return'<div class="stat-card"><div class="stat-value">'+v+'</div><div class="stat-label">'+l+'</div></div>'}
    function dailyChart(daily){var allDates=new Set(Object.keys(daily.pageViews).concat(Object.keys(daily.visitors)));var dates=Array.from(allDates).sort();var max=Math.max.apply(null,dates.map(function(d){return Math.max(daily.pageViews[d]||0,daily.visitors[d]||0)}));if(max<1)max=1;var html='<div class="bar-chart">';dates.forEach(function(date){var pv=daily.pageViews[date]||0,v=daily.visitors[date]||0;var pvH=Math.max(2,(pv/max)*100),vH=Math.max(2,(v/max)*100);html+='<div class="bar-col"><div class="bar-value">'+pv+'</div><div style="display:flex;gap:1px;align-items:flex-end;width:100%;height:100%"><div class="bar" style="height:'+pvH+'%;flex:1"></div><div class="bar secondary" style="height:'+vH+'%;flex:1"></div></div><div class="bar-label">'+date.substring(5)+'</div></div>'});return html+'</div>'}
    function hourlyChart(hourly){var max=Math.max.apply(null,hourly);if(max<1)max=1;var html='<div class="bar-chart" style="height:80px">';for(var h=0;h<24;h++){var v=hourly[h],height=Math.max(2,(v/max)*100);html+='<div class="bar-col">';if(v>0)html+='<div class="bar-value">'+v+'</div>';html+='<div class="bar" style="height:'+height+'%;width:100%"></div>';if(h%3===0)html+='<div class="bar-label">'+h+'h</div>';html+='</div>'}return html+'</div>'}
    function tableChart(data){var entries=Object.entries(data);if(!entries.length)return'';var max=Math.max.apply(null,entries.map(function(e){return e[1]}));var html='<table class="data-table">';entries.forEach(function(e){html+='<tr><td>'+esc(e[0])+'</td><td class="bar-cell"><div class="inline-bar" style="width:'+((e[1]/max)*100)+'%"></div></td><td>'+e[1]+'</td></tr>'});return html+'</table>'}
    function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
    (function(){var to=new Date(),from=new Date();from.setDate(from.getDate()-7);document.getElementById('dateFrom').value=fmt(from);document.getElementById('dateTo').value=fmt(to);loadData(fmt(from),fmt(to))})()
  </script>
</body>
</html>
