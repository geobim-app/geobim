  </div>

  </div>

  <!-- Hide Mode Indicator -->
  <div id="hideModeIndicator" class="mode-indicator">
    🙈 HIDE MODE - Click on elements to hide (ESC or H to exit)
  </div>

  <!-- Comment Mode Indicator -->

    💬 COMMENT MODE - RIGHT-CLICK on 3D model to place comment (ESC or C to exit)
  </div>

  <!-- Status Indicator -->

  <!-- Comment Dialog -->
  <div id="commentDialog" style="position: fixed; display: none; background: rgba(26, 32, 44, 0.98); backdrop-filter: blur(10px); border-radius: 16px; color: white; z-index: 250; box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); min-width: 380px; max-width: 420px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden;">
    <div id="commentDialogHeader" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.08); cursor: grab; user-select: none;">
      <h4 style="margin: 0; color: #6EECD8; font-size: 16px; font-weight: 700;" id="commentDialogTitle">New Comment</h4>
      <button onclick="BimViewer.closeCommentDialog()" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer;">✕</button>
    </div>
    <div style="padding: 20px;">

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Title *</label>
      <input type="text" id="commentTitleInput" placeholder="Comment title..." style="width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; font-size: 14px; transition: all 0.2s ease;">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Comment</label>
      <textarea id="commentTextInput" placeholder="Your comment..." style="width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.05); color: white; min-height: 120px; resize: vertical; box-sizing: border-box; font-size: 14px; font-family: inherit; transition: all 0.2s ease;"></textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
      <div>
        <label style="display: block; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Category</label>
        <select id="commentCategory" style="width: 100%; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: #1a202c; color: white; box-sizing: border-box; font-size: 14px;">
          <option value="General" style="background: #1a202c; color: white;">📋 General</option>
          <option value="Architecture" style="background: #1a202c; color: white;">🏛️ Architecture</option>
          <option value="Structure" style="background: #1a202c; color: white;">🗿 Structure</option>
          <option value="MEP" style="background: #1a202c; color: white;">⚡ MEP</option>
          <option value="Issue" style="background: #1a202c; color: white;">⚠️ Issue</option>
          <option value="Question" style="background: #1a202c; color: white;">❓ Question</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Priority</label>
        <select id="commentPriority" style="width: 100%; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: #1a202c; color: white; box-sizing: border-box; font-size: 14px;">
          <option value="Low" style="background: #1a202c; color: white;">⚪ Low</option>
          <option value="Normal" selected style="background: #1a202c; color: white;">🔵 Normal</option>
          <option value="High" style="background: #1a202c; color: white;">🔴 High</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.8);">
        <input type="checkbox" id="inspectionCheckbox" onchange="document.getElementById('inspectionFields').style.display = this.checked ? 'block' : 'none'" style="width: 16px; height: 16px; accent-color: #FBBF24; cursor: pointer;">
        Inspection comment
      </label>
    </div>

    <div id="inspectionFields" style="display: none; margin-bottom: 16px; border: 1px solid rgba(251,191,36,0.3); border-radius: 10px; padding: 14px; background: rgba(251,191,36,0.05);">
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
        <div>
          <label style="display: block; font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; font-weight: 600;">Condition</label>
          <select id="inspectionRating" style="width: 100%; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: #1a202c; color: white; font-size: 13px;">
            <option value="1" style="background: #1a202c;">1 - Good</option>
            <option value="2" style="background: #1a202c;">2 - Fair</option>
            <option value="3" style="background: #1a202c;">3 - Poor</option>
            <option value="4" style="background: #1a202c;">4 - Critical</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; font-weight: 600;">Component</label>
          <select id="inspectionComponent" style="width: 100%; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: #1a202c; color: white; font-size: 13px;">
            <option value="superstructure" style="background: #1a202c;">Superstructure</option>
            <option value="substructure" style="background: #1a202c;">Substructure</option>
            <option value="bearings" style="background: #1a202c;">Bearings</option>
            <option value="joints" style="background: #1a202c;">Joints</option>
            <option value="drainage" style="background: #1a202c;">Drainage</option>
            <option value="equipment" style="background: #1a202c;">Equipment</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; font-weight: 600;">Damage</label>
          <select id="inspectionDamageType" style="width: 100%; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: #1a202c; color: white; font-size: 13px;">
            <option value="crack" style="background: #1a202c;">Crack</option>
            <option value="spalling" style="background: #1a202c;">Spalling</option>
            <option value="corrosion" style="background: #1a202c;">Corrosion</option>
            <option value="deformation" style="background: #1a202c;">Deformation</option>
            <option value="leakage" style="background: #1a202c;">Leakage</option>
            <option value="other" style="background: #1a202c;">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <button onclick="BimViewer.closeCommentDialog()" style="flex: 1; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease;">
        Cancel

      <button onclick="BimViewer.saveCommentFromDialog()" style="flex: 1; background: linear-gradient(135deg, #6EECD8 0%, #3DB8A0 100%); color: #0E1117; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(110, 236, 216, 0.3); transition: all 0.2s ease;">
        Save Comment
      </button>
    </div>
    </div>
  </div>

  <!-- ============================================
       INITIALIZATION SCRIPT
       ============================================ -->
  <script>
    // Flag to track if viewer has been initialized
    let viewerInitialized = false;

    window.addEventListener('load', function() {
      console.log('Page loaded, waiting for splash dismissal and authentication...');

      // Wait for splash dismissal and then initialize
      const initSystems = setInterval(function() {
        // First check if splash was dismissed (set by splash-screen.js)
        if (!window._splashDismissed) {
          return;
        }

        // Check if auth is initialized (demo mode)
        if (!BimAuth || !BimAuth.initialized) {
          return;
        }

        // Check if Ion Token is available
        const ionToken = BimAuth.getIonToken();
        if (!ionToken) {
          console.log('Waiting for Cesium Ion Token...');
          return;
        }

        // Check if viewer already initialized
        if (viewerInitialized) {
          return;
        }

        console.log('User authenticated and Ion Token available');
        console.log('Initializing BIM Viewer...');

        // Apply Ion Token to Cesium BEFORE init
        if (typeof Cesium !== 'undefined' && Cesium.Ion) {
          Cesium.Ion.defaultAccessToken = ionToken;
          console.log('Cesium Ion Token applied');
        }

        // Initialize BimViewer
        if (typeof BimViewer !== 'undefined' && typeof BimViewer.init === 'function') {
          viewerInitialized = true;

          BimViewer.init().then(() => {
            console.log('BimViewer.init() completed');

            // Apply PERFORMANCE preset on startup (no shadows)
            if (typeof CONFIG !== 'undefined' && CONFIG.performance && CONFIG.performance.presets) {
              BimViewer.applyPerformanceSettings(CONFIG.performance.presets.PERFORMANCE);
              console.log('Started in PERFORMANCE mode (no shadows)');

              // Update settings dropdown to reflect PERFORMANCE preset
              const performanceSelect = document.getElementById('performancePreset');
              if (performanceSelect) {
                performanceSelect.value = 'PERFORMANCE';
              }
            }

            // Load EGM96 geoid grid for coordinate picker
            if (typeof GEOBIM_GEOID !== 'undefined') {
              GEOBIM_GEOID.load();
            }

            // Now initialize features (after viewer is ready)
            if (typeof BimViewer.initFeatures === 'function') {
              BimViewer.initFeatures();
              console.log('Features initialized');
            }

            // Initialize lighting system
            if (typeof BimViewer.initLighting === 'function' && !BimViewer.lighting) {
              BimViewer.initLighting();
              console.log('Lighting system initialized');
            }

            // Auto-load Ion assets
            if (typeof BimViewerUI !== 'undefined' && typeof BimViewerUI.autoLoadIonAssets === 'function') {
              BimViewerUI.autoLoadIonAssets();
              console.log('Auto-loading Ion assets...');
            }

            // Wait for first asset before initializing other systems
            waitForAssetAndInitSystems();

          }).catch(error => {
            console.error('BimViewer.init() failed:', error);
            viewerInitialized = false;
          });

          // Stop the interval - init started
          clearInterval(initSystems);
        }

      }, 500);
    });

    // Wait for asset to load before initializing Firebase/Comments
    function waitForAssetAndInitSystems() {
      console.log('Waiting for first asset to load...');

      const assetCheck = setInterval(function() {
        if (!BimViewer.viewer) {
          return;
        }

        // Check if at least one asset is loaded
        if (BimViewer.loadedAssets && BimViewer.loadedAssets.size > 0) {
          clearInterval(assetCheck);
          console.log('Asset detected, initializing remaining systems...');

          initializeRemainingSystems();
        }
      }, 500);

      // Also allow manual initialization after 5 seconds even without asset
      setTimeout(() => {
        if (BimViewer.viewer && !BimViewer.loadedAssets?.size) {
          console.log('No asset loaded yet, but initializing systems anyway...');
          initializeRemainingSystems();
        }
      }, 5000);
    }

    // Initialize Comments (localStorage), Hide Features, etc.
    function initializeRemainingSystems() {
      console.log('');
      console.log('INITIALIZING REMAINING SYSTEMS:');

      // Initialize Comments (Firestore - Demo Mode)
      // Wait for anonymous auth to complete before initializing Firestore comments
      function initComments() {
        const authUser = BimAuth.getFirebaseUser();
        if (!authUser) {
          console.log('Waiting for anonymous auth...');
          setTimeout(initComments, 500);
          return;
        }

        if (typeof BimViewer.initFirebase === 'function') {
          if (BimViewer.initFirebase()) {
            console.log('Comments initialized (Firestore - Demo Mode)');
            const statusEl = document.getElementById('commentsListStatus');
            if (statusEl) statusEl.textContent = 'Ready';
          } else {
            console.log('Comments initialization deferred');
            setTimeout(initComments, 1000);
          }
        }
      }
      initComments();

      // Initialize comment click handler (if not already done in features)
      if (typeof BimViewer.initCommentClickHandler === 'function' && !BimViewer.comments?.clickHandlerInitialized) {
        BimViewer.initCommentClickHandler();
        console.log('Comment click handler initialized');
      }

      // Initialize hide features
      if (typeof BimViewer.initHideFeatures === 'function') {
        BimViewer.initHideFeatures();
        console.log('Hide features initialized');
      }

      // Initialize point cloud settings
      if (typeof BimViewer.initPointCloudSettings === 'function') {
        BimViewer.initPointCloudSettings();
        console.log('Point cloud settings initialized');
      }

      console.log('');
      console.log('All systems ready!');
      console.log('Demo Mode active - user:', BimAuth.getCurrentUser()?.email);
      console.log('');
    }
  </script>
