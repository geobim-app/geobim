<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- App Configuration (create from config.example.js) -->

  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.139.1/Build/Cesium/Widgets/widgets.css">

  <link rel="stylesheet" href="auth-styles.css">

  <!-- Z-Offset Styles -->

  <!-- Clipping Planes Styles -->
  <link rel="stylesheet" href="clipping-planes-styles.css">

  <!-- Lighting v4.0 Styles -->
  <link rel="stylesheet" href="lighting-styles.css">

  <!-- Splash Screen Styles -->
  <link rel="stylesheet" href="splash-screen.css">

  <!-- Comments Styles -->
  <link rel="stylesheet" href="comments-styles.css">

  <!-- Layer Manager Styles -->

  <!-- Sequencing Styles -->

</head>
<body>

  <!-- Splash Screen (created dynamically by splash-screen.js) -->

  <!-- Login screen removed - Demo mode active -->

  <!-- ============================================
       MAIN APP (Hidden until logged in)
       ============================================ -->

  <!-- Main Cesium Container -->
  <div id="cesiumContainer" style="display: none;"></div>

  <!-- Split-Screen Slider -->
  <div id="splitSlider"></div>

  <!-- Sidebar Toggle Button -->
  <button id="sidebarToggle" class="sidebar-toggle at-edge" style="display: none;" title="Toggle sidebar (M)">☰</button>

  <!-- Modern Toolbar -->
  <div id="toolbar" class="collapsed" style="display: none;"></div>

  <!-- Bottom Action Toolbar -->
  <div id="bottomToolbar" class="bottom-toolbar" style="display: none;"></div>

  <!-- Custom Info Box (Floating Panel) -->
  <div id="infoBoxPanel">
    <div id="infoBoxHeader" class="floating-panel-header">
      <span class="floating-panel-title" id="infoBoxPanelTitle">Element Properties</span>
      <div class="floating-panel-controls">
        <button class="floating-panel-btn" onclick="BimViewer.toggleInfoBoxCollapse()" id="infoBoxCollapseBtn" title="Collapse">−</button>
        <button class="floating-panel-btn" onclick="BimViewer.closeInfoBox()" title="Close">✕</button>
      </div>
    </div>
    <div id="infoBoxBody" class="floating-panel-body">
      <div id="infoBoxCustom"></div>
    </div>
  </div>

  <!-- Drawing Mode Indicator -->
  <div id="modeIndicator" class="mode-indicator">
    ✏️ DRAWING MODE ACTIVE - Click map to add polygon points
  </div>

  <!-- Hide Mode Indicator -->
  <div id="hideModeIndicator" class="mode-indicator">
    🙈 HIDE MODE - Click on elements to hide (ESC or H to exit)
  </div>

  <!-- Comment Mode Indicator -->
  <div id="commentModeIndicator" class="mode-indicator">
    💬 COMMENT MODE - RIGHT-CLICK on 3D model to place comment (ESC or C to exit)
  </div>

  <!-- Status Indicator -->
  <div id="statusIndicator" class="status-indicator">
    Status updates will appear here
  </div>

  <!-- Comment Dialog (styles in comments-styles.css) -->
  <div id="commentDialog">
    <div id="commentDialogHeader">
      <h4 id="commentDialogTitle">New Comment</h4>
      <button class="cd-close-btn" onclick="BimViewer.closeCommentDialog()">✕</button>
    </div>
    <div class="cd-body">

    <div class="cd-field">
      <label class="cd-label">Title *</label>
      <input type="text" id="commentTitleInput" class="cd-input" placeholder="Comment title...">
    </div>

    <div class="cd-field">
      <label class="cd-label">Comment</label>
      <textarea id="commentTextInput" class="cd-textarea" placeholder="Your comment..."></textarea>
    </div>

    <div class="cd-grid">
      <div>
        <label class="cd-label">Category</label>
        <select id="commentCategory" class="cd-select">
          <option value="General">General</option>
          <option value="Architecture">Architecture</option>
          <option value="Structure">Structure</option>
          <option value="MEP">MEP</option>
          <option value="Issue">Issue</option>
          <option value="Question">Question</option>
        </select>
      </div>

      <div>
        <label class="cd-label">Priority</label>
        <select id="commentPriority" class="cd-select">
          <option value="Low">Low</option>
          <option value="Normal" selected>Normal</option>
          <option value="High">High</option>
        </select>
      </div>
    </div>

    <div class="cd-field">
      <label class="cd-checkbox-label">
        <input type="checkbox" id="inspectionCheckbox" class="cd-checkbox" onchange="document.getElementById('inspectionFields').style.display = this.checked ? 'block' : 'none'">
        Inspection comment
      </label>
    </div>

    <div id="inspectionFields" class="cd-inspection-fields">
      <div class="cd-grid-3">
        <div>
          <label class="cd-label-sm">Condition</label>
          <select id="inspectionRating" class="cd-select-sm">
            <option value="1">1 - Good</option>
            <option value="2">2 - Fair</option>
            <option value="3">3 - Poor</option>
            <option value="4">4 - Critical</option>
          </select>
        </div>
        <div>
          <label class="cd-label-sm">Component</label>
          <select id="inspectionComponent" class="cd-select-sm">
            <option value="superstructure">Superstructure</option>
            <option value="substructure">Substructure</option>
            <option value="bearings">Bearings</option>
            <option value="joints">Joints</option>
            <option value="drainage">Drainage</option>
            <option value="equipment">Equipment</option>
          </select>
        </div>
        <div>
          <label class="cd-label-sm">Damage</label>
          <select id="inspectionDamageType" class="cd-select-sm">
            <option value="crack">Crack</option>
            <option value="spalling">Spalling</option>
            <option value="corrosion">Corrosion</option>
            <option value="deformation">Deformation</option>
            <option value="leakage">Leakage</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="cd-buttons">
      <button class="cd-btn-cancel" onclick="BimViewer.closeCommentDialog()">Cancel</button>
      <button class="cd-btn-save" onclick="BimViewer.saveCommentFromDialog()">Save Comment</button>
    </div>
    </div>
  </div>

       ============================================ -->

  <!-- Splash Screen (before auth) -->
  <script src="splash-screen.js"></script>

  <!-- Auth Module -->
  <script src="auth.js"></script>

  <!-- Auth Gate - Email/Password login overlay (blocks app until authenticated) -->
  <script src="auth-gate.js"></script>

  <!-- 1. Core Modules (Foundation) -->
  <script src="core.js"></script>
  <script src="features.js"></script>
  <script src="hideFeatures.js"></script>
  <script src="comments.js"></script>
  <script src="inspection.js"></script>
  <script src="geoid_terrain.js"></script>
  <script src="pointcloud.js"></script>
  <script src="geoid.js"></script>
  <script src="measurement.js"></script>
  <script src="measurement-store.js"></script>

  <!-- 2. Enhanced Clipping Module -->
  <script src="clipping.js"></script>

  <!-- 3. Z-Offset Module v2.0 -->
  <script src="z-offset.js"></script>

  <!-- 3.5. Layer Manager -->
  <script src="layerManager.js"></script>


  <!-- ============================================
       LIGHTING v4.0 - NEW SETUP
       ============================================ -->

  <!-- 4. Lighting Module v4.0 (MUST be loaded FIRST!) -->
  <script src="lighting.js"></script>

  <!-- 4.1. IBL Module (Image-Based Lighting) -->
  <script src="ibl.js"></script>

  <!-- 4.5. NEW: Standalone Lighting UI (loads BEFORE ui.js) -->
  <script src="ui-lighting-standalone.js"></script>

  <!-- ============================================
       UI MODULES
       ============================================ -->

  <!-- 5. UI Module v3.3 -->
  <script src="ui.js"></script>

  <!-- 6. UI Extensions -->
  <script src="ui-comments-extension.js"></script>
  <script src="ui-clipping-extension.js"></script>
  <script src="ui-z-offset-extension.js"></script>
  <script src="clipping-planes.js"></script>
  <script src="sequencing.js"></script>
  <script src="glb-gizmo.js"></script>
  <script src="wea-shadow.js"></script>
  <script src="firstperson.js"></script>
  <script src="thirdperson.js"></script>
  <script src="sib.js"></script>

  <!-- 7. OLD Lighting UI Extension - NOT NEEDED ANYMORE (commented out) -->
  <!-- <script src="ui-lighting-extension.js"></script> -->

  <!-- 8. UI Helpers (final touches) -->
  <script src="ui-helpers-modern.js"></script>

  <!-- 9. About & Feedback -->
  <script src="about-feedback.js"></script>

  <!-- 9.1. Onboarding Tour -->
  <script src="onboarding.js"></script>

  <!-- 9.5. BCF Export (requires JSZip) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="bcf-export.js"></script>

  <!-- 10. IoT Live Sensors -->
  <script src="iot.js"></script>

  <!-- 10. OGC SensorThings API -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="sensorthings.js"></script>

  <!-- ============================================
       INITIALIZATION SCRIPT
       ============================================ -->
  <script>
    // Flag to track if viewer has been initialized
    let viewerInitialized = false;

    window.addEventListener('load', function() {
      console.log('Page loaded, waiting for splash dismissal and authentication...');

      // Wait for splash dismissal and then initialize
      const initSystems = setInterval(function() {
        // First check if splash was dismissed (set by splash-screen.js)
        if (!window._splashDismissed) {
          return;
        }

        // Check if auth is initialized (demo mode)
        if (!BimAuth || !BimAuth.initialized) {
          return;
        }

        // Check if Ion Token is available
        const ionToken = BimAuth.getIonToken();
        if (!ionToken) {
          console.log('Waiting for Cesium Ion Token...');
          return;
        }

        // Check if viewer already initialized
        if (viewerInitialized) {
          return;
        }

        console.log('User authenticated and Ion Token available');
        console.log('Initializing BIM Viewer...');

        // Apply Ion Token to Cesium BEFORE init
        if (typeof Cesium !== 'undefined' && Cesium.Ion) {
          Cesium.Ion.defaultAccessToken = ionToken;
          console.log('Cesium Ion Token applied');
        }

        // Initialize BimViewer
        if (typeof BimViewer !== 'undefined' && typeof BimViewer.init === 'function') {
          viewerInitialized = true;

          BimViewer.init().then(() => {
            console.log('BimViewer.init() completed');

            // Apply PERFORMANCE preset on startup (no shadows)
            if (typeof CONFIG !== 'undefined' && CONFIG.performance && CONFIG.performance.presets) {
              BimViewer.applyPerformanceSettings(CONFIG.performance.presets.PERFORMANCE);
              console.log('Started in PERFORMANCE mode (no shadows)');

              // Update settings dropdown to reflect PERFORMANCE preset
              const performanceSelect = document.getElementById('performancePreset');
              if (performanceSelect) {
                performanceSelect.value = 'PERFORMANCE';
              }
            }

            // Load EGM96 geoid grid for coordinate picker
            if (typeof GEOBIM_GEOID !== 'undefined') {
              GEOBIM_GEOID.load();
            }

            // Now initialize features (after viewer is ready)
            if (typeof BimViewer.initFeatures === 'function') {
              BimViewer.initFeatures();
              console.log('Features initialized');
            }

            // Initialize lighting system
            if (typeof BimViewer.initLighting === 'function' && !BimViewer.lighting) {
              BimViewer.initLighting();
              console.log('Lighting system initialized');
            }

            // Auto-load Ion assets
            if (typeof BimViewerUI !== 'undefined' && typeof BimViewerUI.autoLoadIonAssets === 'function') {
              BimViewerUI.autoLoadIonAssets();
              console.log('Auto-loading Ion assets...');
            }

            // Wait for first asset before initializing other systems
            waitForAssetAndInitSystems();

          }).catch(error => {
            console.error('BimViewer.init() failed:', error);
            viewerInitialized = false;
          });

          // Stop the interval - init started
          clearInterval(initSystems);
        }

      }, 500);
    });

    // Wait for asset to load before initializing Firebase/Comments
    function waitForAssetAndInitSystems() {
      console.log('Waiting for first asset to load...');

      const assetCheck = setInterval(function() {
        if (!BimViewer.viewer) {
          return;
        }

        // Check if at least one asset is loaded
        if (BimViewer.loadedAssets && BimViewer.loadedAssets.size > 0) {
          clearInterval(assetCheck);
          console.log('Asset detected, initializing remaining systems...');

          initializeRemainingSystems();
        }
      }, 500);

      // Also allow manual initialization after 5 seconds even without asset
      setTimeout(() => {
        if (BimViewer.viewer && !BimViewer.loadedAssets?.size) {
          console.log('No asset loaded yet, but initializing systems anyway...');
          initializeRemainingSystems();
        }
      }, 5000);
    }

    // Initialize Comments (localStorage), Hide Features, etc.
    function initializeRemainingSystems() {
      console.log('');
      console.log('INITIALIZING REMAINING SYSTEMS:');

      // Initialize Comments (Firestore - Demo Mode)
      // Wait for anonymous auth to complete before initializing Firestore comments
      function initComments() {
        const authUser = BimAuth.getFirebaseUser();
        if (!authUser) {
          console.log('Waiting for anonymous auth...');
          setTimeout(initComments, 500);
          return;
        }

        if (typeof BimViewer.initFirebase === 'function') {
          if (BimViewer.initFirebase()) {
            console.log('Comments initialized (Firestore - Demo Mode)');
            const statusEl = document.getElementById('commentsListStatus');
            if (statusEl) statusEl.textContent = 'Ready';
          } else {
            console.log('Comments initialization deferred');
            setTimeout(initComments, 1000);
          }
        }
      }
      initComments();

      // Initialize comment click handler (if not already done in features)
      if (typeof BimViewer.initCommentClickHandler === 'function' && !BimViewer.comments?.clickHandlerInitialized) {
        BimViewer.initCommentClickHandler();
        console.log('Comment click handler initialized');
      }

      // Initialize hide features
      if (typeof BimViewer.initHideFeatures === 'function') {
        BimViewer.initHideFeatures();
        console.log('Hide features initialized');
      }

      // Initialize point cloud settings
      if (typeof BimViewer.initPointCloudSettings === 'function') {
        BimViewer.initPointCloudSettings();
        console.log('Point cloud settings initialized');
      }

      console.log('');
      console.log('All systems ready!');
      console.log('Demo Mode active - user:', BimAuth.getCurrentUser()?.email);
      console.log('');
    }
  </script>
</body>
