# Deploy the geoBIM viewer via SSH:
#   push to staging → beta.geobim.app  (forced command /usr/local/bin/geobim-deploy-staging)
#   push to main    → viewer.geobim.app (forced command /usr/local/bin/geobim-deploy)
# Each environment has its own deploy key, restricted in authorized_keys with
# command="...", so a connection can only run that one deploy script.
# Setup: DEPLOYMENT.md

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a newer push waits instead of cancelling a running one
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://viewer.geobim.app' || 'https://beta.geobim.app' }}
    steps:
      - name: Set up SSH key and known_hosts
        env:
          # Separate secret names, so staging can never fall back to the production key
          DEPLOY_KEY: ${{ github.ref_name == 'main' && secrets.DEPLOY_KEY || secrets.DEPLOY_STAGING_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Deploy key for ${{ github.ref_name }} or DEPLOY_KNOWN_HOSTS not set (DEPLOYMENT.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy script on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          # The forced command on the server ignores whatever command is sent here
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
